[project]
name = "susurro"
version = "0.0.1"
description = "Local-first, real-time copilot for meetings and interviews"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = []

[project.optional-dependencies]
core = ["websockets>=13", "opuslib>=3.0.1"]
whisper = ["faster-whisper>=1.1", "numpy>=1.26"]
openai = ["httpx>=0.27"]
vad = ["onnxruntime>=1.16.1", "numpy>=1.26"]
bench = ["httpx>=0.27", "faster-whisper>=1.1", "numpy>=1.26"]
capture = ["websockets>=13", "opuslib>=3.0.1"]
dev = ["onnxruntime>=1.16.1", "numpy>=1.26", "pytest>=8", "pytest-asyncio>=0.24", "pytest-playwright>=0.5", "ruff>=0.6"]

[project.scripts]
# argparse has announced these names since the beginning; nothing declared
# them, so `susurro-core` was "command not found" in a shell and in the docs.
susurro-core = "core.main:main"
susurro-capture = "capture.main:main"
susurro-bench = "bench.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "capture", "bench"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
# Line length is checked by review, not by a tool: the comments in this project
# explain why a decision was made, and a hard wrap that splits a sentence badly
# is worse than a long line.
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private attributes on purpose, to inject a stub model or a
# mock transport where the production path would load weights or open a socket.
"tests/*" = ["SLF001"]
