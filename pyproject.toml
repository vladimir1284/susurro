[project]
name = "susurro"
version = "0.0.1"
description = "Local-first, real-time copilot for meetings and interviews"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = []

[project.optional-dependencies]
core = ["websockets>=13", "opuslib>=3.0.1"]
whisper = ["faster-whisper>=1.1", "numpy>=1.26"]
openai = ["httpx>=0.27"]
bench = ["httpx>=0.27", "faster-whisper>=1.1", "numpy>=1.26"]
capture = ["websockets>=13", "opuslib>=3.0.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-playwright>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "capture"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
