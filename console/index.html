<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Susurro console</title>
<link rel="stylesheet" href="console.css">
</head>
<body>
<header>
  <h1>Susurro</h1>
  <span class="pill" id="session-pill" data-session="idle">idle</span>
  <span class="pill" id="lane-mic" data-up="false">mic</span>
  <span class="pill" id="lane-far" data-up="false">far</span>
  <span class="pill" id="recording-pill" hidden>● recording</span>
  <span class="spacer"></span>
  <label class="visually-hidden" for="profile">Profile</label>
  <select id="profile" aria-label="Profile"></select>
  <button id="start" type="button">Start</button>
  <button id="hint-button" type="button" disabled>Hint</button>
  <button id="stop" type="button" disabled>Stop</button>
  <button id="edit" type="button" disabled>Edit</button>
  <button id="history" type="button">History</button>
</header>

<section id="history-panel" aria-label="Recorded sessions" hidden>
  <div class="row">
    <strong>Recorded sessions</strong>
    <span class="spacer"></span>
    <button id="history-close" type="button">Close</button>
  </div>
  <p id="history-empty" hidden></p>
  <ul id="history-list"></ul>
  <div id="export-view" hidden>
    <div class="row">
      <strong id="export-title"></strong>
      <span class="spacer"></span>
      <a id="export-download" download>Download</a>
      <button id="export-close" type="button">Back</button>
    </div>
    <pre id="export-text"></pre>
  </div>
</section>

<section id="editor" aria-label="Profile editor" hidden>
  <div class="row">
    <label for="editor-label">Label</label>
    <input id="editor-label" type="text" autocomplete="off">
    <label for="editor-language">Language</label>
    <select id="editor-language">
      <option value="en">en</option>
      <option value="es">es</option>
    </select>
    <label for="editor-mode">Mode</label>
    <select id="editor-mode">
      <option value="conversational">conversational</option>
      <option value="technical">technical</option>
      <option value="business">business</option>
    </select>
  </div>
  <label for="editor-resume">Background</label>
  <textarea id="editor-resume" rows="6"></textarea>
  <label for="editor-role">This session</label>
  <textarea id="editor-role" rows="4"></textarea>
  <label for="editor-notes">Notes</label>
  <textarea id="editor-notes" rows="3"></textarea>
  <div class="row">
    <button id="editor-save" type="button">Save</button>
    <button id="editor-close" type="button">Close</button>
    <span id="editor-status"></span>
  </div>
</section>

<main id="transcript" aria-live="polite" aria-label="Transcript"></main>

<section id="hint-panel" aria-live="assertive" aria-label="Current hint">
  <pre id="hint-body"></pre>
  <div id="hint-meta"></div>
</section>

<div id="errors" role="status"></div>

<script type="module" src="app.js"></script>
</body>
</html>
