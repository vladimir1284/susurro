name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      # opuslib binds libopus through ctypes, so the system library has to be
      # present even though the Python package installs from a wheel.
      - name: Install libopus
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libopus0

      - name: Install the project
        run: pip install -e ".[core,openai,whisper,dev]"

      - name: Lint
        run: ruff check .

      # Keyed on the resolved Playwright version: a cache keyed on anything
      # looser serves a browser the client refuses to drive.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(python -c 'import playwright; print(playwright.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Run tests
        run: pytest -q

      # The slow test loads a real speech model. It is skipped by default
      # because it says nothing about the target hardware, but it is the only
      # thing that would catch faster-whisper's API changing underneath us, so
      # it runs on a schedule rather than never.
      - name: Smoke test the real model
        if: github.event_name == 'workflow_dispatch'
        env:
          SUSURRO_SLOW_TESTS: '1'
        run: pytest -q -k real
